<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fb"><title>今日の出席 | 朝のチェックイン</title><link rel="stylesheet" href="css/attendance.css"></head><body><main class="att-shell"><header class="att-top"><div class="brand"><img src="assets/images/5小マスコット.png" alt="マスコット"><div><p class="eyebrow">担任用</p><h1>今日の出席</h1><p>朝のチェックインをもとに、確認が必要な児童だけを見ます。</p></div></div><nav><a href="monthly-attendance.html">月間出席簿</a><a href="dashboard.html">ダッシュボード</a><a href="teacher.html">初期設定</a></nav></header><section class="controls"><label>学級<input id="att-class" value="1-1"></label><label>日付<input id="att-date" type="date"></label><button id="att-reload" type="button">更新</button><div class="now"><span>現在</span><strong id="att-clock">--:--</strong></div></section><section class="summary"><article><span>在籍</span><strong id="sum-total">0</strong></article><article class="ok"><span>出席</span><strong id="sum-present">0</strong></article><article class="warn"><span>要確認</span><strong id="sum-unconfirmed">0</strong></article><article><span>遅刻</span><strong id="sum-late">0</strong></article><article><span>欠席</span><strong id="sum-absent">0</strong></article></section><section class="attention-card"><div class="section-head"><div><p class="eyebrow">先にここだけ</p><h2>要確認</h2><p>未確認・欠席理由未確定など、先生が見る必要のある児童を上にまとめます。</p></div><span id="att-status">読み込み中…</span></div><div id="needs-list" class="student-list"></div></section><details class="all-card"><summary>全員を見る</summary><div id="all-list" class="student-list"></div></details><footer class="confirm-bar"><div><strong id="confirm-label">未確認の児童を確認してください</strong><small>欠席は自動確定しません。通信や操作忘れを誤って欠席にしないためです。</small></div><button id="confirm-today" type="button">今日を確認済みにする</button></footer></main><script src="js/attendance.js"></script></body></html>

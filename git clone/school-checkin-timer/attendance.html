<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fb"><title>今日の出席・健康観察 | 朝のチェックイン</title><link rel="stylesheet" href="css/attendance.css"></head><body><main class="att-shell"><header class="att-top"><div class="brand"><img src="assets/images/5小マスコット.png" alt="マスコット"><div><p class="eyebrow">担任用・毎朝ここから</p><h1>今日の出席・健康観察</h1><p>朝のチェックインをもとに、出欠と健康状態を同じ画面で確認します。</p></div></div><nav><a href="teacher.html">担任ホーム</a><a href="dashboard.html">心の天気・教室のようす</a><a href="monthly-attendance.html">月間出席簿</a><a href="term-attendance.html">学期・年度集計</a></nav></header><section class="controls"><label>学級<input id="att-class" value="1-1"></label><label>日付<input id="att-date" type="date"></label><button id="att-reload" type="button">更新</button><div class="now"><span>現在</span><strong id="att-clock">--:--</strong></div></section><section class="summary"><article><span>在籍</span><strong id="sum-total">0</strong></article><article class="ok"><span>出席</span><strong id="sum-present">0</strong></article><article class="warn"><span>要確認</span><strong id="sum-unconfirmed">0</strong></article><article><span>遅刻</span><strong id="sum-late">0</strong></article><article><span>欠席</span><strong id="sum-absent">0</strong></article><article class="health-watch"><span>健康 要観察</span><strong id="sum-health-watch">0</strong></article><article class="health-care"><span>保健室・体調不良</span><strong id="sum-health-care">0</strong></article></section><section class="attention-card"><div class="section-head"><div><p class="eyebrow">先にここだけ</p><h2>要確認</h2><p>出欠未確認に加え、健康状態が「要観察・保健室・体調不良」の児童も上にまとめます。</p></div><span id="att-status">読み込み中…</span></div><div id="needs-list" class="student-list"></div></section><details class="all-card"><summary>全員を見る</summary><div id="all-list" class="student-list"></div></details><footer class="confirm-bar"><div><strong id="confirm-label">未確認の児童を確認してください</strong><small>欠席は自動確定しません。健康観察も担任が確認して記録します。</small></div><button id="confirm-today" type="button">今日を確認済みにする</button></footer></main><script src="js/attendance.js"></script></body></html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eaf8ff">
  <title>朝のチェックイン | School Check-in Timer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app-shell" aria-label="朝のチェックイン">
    <header class="topbar">
      <div class="brand"><img class="brand-mascot" src="assets/images/5小マスコット.png" alt="朝のチェックイン マスコット"><div><p class="eyebrow">おはよう！ きょうも いいスタートを</p><h1>朝のチェックイン</h1></div></div>
      <section class="clock-card" aria-label="現在時刻"><div class="clock-date" id="clock-date">--月--日 ---</div><div class="clock-row"><div class="analog-clock" aria-hidden="true"><span class="hand hour" id="clock-hour"></span><span class="hand minute" id="clock-minute"></span><span class="hand second" id="clock-second"></span><span class="clock-center"></span></div><time class="digital-clock" id="digital-clock">--:--</time></div></section>
    </header>
    <section class="hero-grid">
      <article class="welcome-card"><div class="speech-bubble"><span class="speech-kicker">きょうの こころは</span><strong>どんな てんき？</strong></div><img class="hero-mascot" src="assets/images/5小マスコット.png" alt="手をあげてあいさつするマスコット"><div class="weather-buttons" role="group" aria-label="心の天気"><button class="weather sunny" type="button"><span>☀️</span><b>はれ</b></button><button class="weather cloudy" type="button"><span>☁️</span><b>くもり</b></button><button class="weather rainy" type="button"><span>🌧️</span><b>あめ</b></button><button class="weather thunder" type="button"><span>⛈️</span><b>かみなり</b></button></div></article>
      <article class="routine-card"><div class="routine-head"><div><p class="eyebrow">あさの じゅんび</p><h2>できたら タッチ！</h2></div><div class="progress-pill"><span id="task-done">0</span>/<span id="task-total">0</span></div></div><div class="task-grid" id="task-grid" aria-live="polite"><div class="task-loading">きょうの じゅんびを よみこみちゅう…</div></div><section class="timer-panel" aria-label="朝の会までの残り時間"><div class="timer-copy"><span>あさのかいまで</span><strong id="countdown">あと --ぷん</strong></div><div class="timer-track" aria-hidden="true"><div class="timer-fill" id="timer-fill"></div></div><div class="timer-meta"><span id="start-time-label">--:-- スタート</span><span id="end-time-label">--:-- あさのかい</span></div></section></article>
    </section>
    <footer class="statusbar"><span class="status-dot"></span><span id="device-label">クラス設定を確認中</span><span class="status-separator">•</span><span id="sync-status">このたんまつは じゅんびOK</span><span class="status-separator">•</span><a class="setup-link" href="setup.html">設定</a></footer>
  </main>
  <script src="js/clock.js"></script><script src="js/timer.js"></script><script src="js/tasks.js"></script><script src="js/app.js"></script>
</body></html>

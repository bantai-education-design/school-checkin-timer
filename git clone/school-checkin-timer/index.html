<!DOCTYPE html>
<html lang="ja" data-grade-mode="low"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eaf8ff"><title>朝のチェックイン | School Check-in Timer</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/device-status.css"><link rel="stylesheet" href="css/polish.css"></head>
<body><main class="app-shell" aria-label="朝のチェックイン">
<header class="topbar"><div class="brand"><img class="brand-mascot" src="assets/images/5小マスコット.png" alt="朝のチェックイン マスコット"><div><p class="eyebrow" id="brand-message">おはよう！ きょうも いいスタートを</p><h1>朝のチェックイン</h1></div></div><section class="clock-card" aria-label="現在時刻"><div class="clock-date" id="clock-date">--月--日 ---</div><div class="clock-row"><div class="analog-clock" aria-label="アナログ時計"><span class="hand hour" id="clock-hour"></span><span class="hand minute" id="clock-minute"></span><span class="hand second" id="clock-second"></span><span class="clock-center"></span></div><time class="digital-clock" id="digital-clock">--:--</time></div></section></header>
<section class="hero-grid"><article class="welcome-card"><div class="speech-bubble"><span class="speech-kicker" id="weather-kicker">きょうの こころは</span><strong id="weather-title">どんな てんき？</strong></div><img class="hero-mascot" src="assets/images/5小マスコット.png" alt="手をあげてあいさつするマスコット"><div class="weather-buttons" role="group" aria-label="心の天気"><button class="weather sunny" type="button" data-weather="sunny"><span>☀️</span><b>はれ</b></button><button class="weather cloudy" type="button" data-weather="cloudy"><span>☁️</span><b>くもり</b></button><button class="weather rainy" type="button" data-weather="rainy"><span>🌧️</span><b>あめ</b></button><button class="weather thunder" type="button" data-weather="thunder"><span>⛈️</span><b>かみなり</b></button></div><textarea id="high-note" class="high-note" maxlength="80" placeholder="今の気持ちや、先生に伝えたいこと（書かなくてもOK）" aria-label="一言メモ"></textarea></article>
<article class="routine-card"><div class="routine-head"><div><p class="eyebrow" id="routine-kicker">あさの じゅんび</p><h2 id="routine-title">できたら タッチ！</h2></div><div class="progress-pill"><span id="task-done">0</span>/<span id="task-total">0</span></div></div><div class="task-grid" id="task-grid" aria-live="polite"><div class="task-loading">きょうの じゅんびを よみこみちゅう…</div></div><section class="timer-panel" aria-label="朝の会までの残り時間"><div class="timer-copy"><span>あさのかいまで</span><strong id="countdown">あと --ぷん</strong></div><div class="timer-track" aria-hidden="true"><div class="timer-fill" id="timer-fill"></div></div><div class="timer-meta"><span id="start-time-label">--:-- スタート</span><span id="end-time-label">--:-- あさのかい</span></div></section></article></section>
<footer class="statusbar"><span class="status-dot"></span><span id="device-label">クラス設定を確認中</span><span class="status-separator">•</span><span id="sync-status">このたんまつは じゅんびOK</span><span class="status-separator">•</span><a class="setup-link" href="setup.html">設定</a></footer></main>
<div id="completion-celebration" class="celebration" hidden><div class="celebration-card"><img src="assets/images/5小マスコット.png" alt="マスコット"><div class="celebration-stars" aria-hidden="true">★　✦　★</div><strong id="celebration-title">あさの じゅんび かんりょう！</strong><p id="celebration-message">きょうも いい一日に しよう！</p><button id="celebration-close" type="button">OK！</button></div></div>
<script src="js/clock.js"></script><script src="js/timer.js"></script><script src="js/tasks.js"></script><script src="js/app.js"></script></body></html>

<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f8fb"><title>月間出席簿 | 朝のチェックイン</title><link rel="stylesheet" href="css/monthly-attendance.css"></head><body><main class="ledger-shell"><header class="ledger-top"><div class="brand"><img src="assets/images/5小マスコット.png" alt="マスコット"><div><p class="eyebrow">担任用</p><h1>月間出席簿</h1><p>確認済みの日だけを集計し、横計・縦計・欠席理由別の月計を自動でまとめます。</p></div></div><nav><a href="attendance.html">今日の出席</a><a href="dashboard.html">ダッシュボード</a></nav></header><section class="controls"><label>学級<input id="ledger-class" value="1-1"></label><label>表示月<input id="ledger-month" type="month"></label><button id="ledger-reload" type="button">更新</button><span id="ledger-status">読み込み中…</span></section><section class="month-summary"><article><span>確認済み授業日</span><strong id="m-days">0</strong><small>日</small></article><article><span>延べ出席</span><strong id="m-present">0</strong><small>件</small></article><article><span>延べ欠席</span><strong id="m-absent">0</strong><small>件</small></article><article><span>遅刻</span><strong id="m-late">0</strong><small>件</small></article><article><span>早退</span><strong id="m-early">0</strong><small>件</small></article></section><section class="ledger-card"><div class="ledger-head"><div><p class="eyebrow">月間一覧</p><h2>児童別の横合計 × 日別の縦合計</h2></div><p>横にスクロールできます。正式な帳票出力は学校様式確認後に追加します。</p></div><div class="table-wrap"><table id="ledger-table"><thead></thead><tbody></tbody><tfoot></tfoot></table></div></section><section class="reason-card"><div><p class="eyebrow">月合計</p><h2>出欠区分別の総計</h2></div><div id="reason-totals" class="reason-grid"></div></section></main><script src="js/attendance-model.js"></script><script src="js/monthly-attendance.js"></script></body></html>

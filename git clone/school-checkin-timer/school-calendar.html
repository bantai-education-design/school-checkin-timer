<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>授業日カレンダー | 朝のチェックイン</title><style>:root{font-family:"Yu Gothic",Meiryo,sans-serif;color:#18324b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef9ff,#fff9e7)}main{max-width:1100px;margin:auto;padding:28px}header,.card{background:#fff;border-radius:26px;padding:22px;box-shadow:0 16px 40px #254c6a18;margin-bottom:16px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1,h2,p{margin-top:0}a{color:#267cb8;font-weight:800}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}label{font-weight:800;color:#617b8e}input,button{font:inherit;padding:10px 12px;border:2px solid #dce9f0;border-radius:12px;background:#fff}button{font-weight:900;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-top:16px}.dow{text-align:center;font-weight:900;color:#6a8294;padding:7px}.day{min-height:94px;border:2px solid #e2edf2;border-radius:16px;background:#fff;padding:9px;text-align:left}.day strong{display:block;font-size:1.1rem}.day small{display:block;margin-top:5px;color:#6a8294}.day.off{background:#f3f5f6;color:#8999a3}.day.special{background:#fff7e9;border-color:#f1cf9d}.day.blank{visibility:hidden}.legend{display:flex;gap:15px;flex-wrap:wrap;color:#617b8e;font-weight:700}.notice{padding:12px 14px;border-radius:14px;background:#eef8ff;color:#326d94;font-weight:700}@media(max-width:650px){main{padding:14px}.calendar{gap:4px}.day{min-height:76px;padding:6px;font-size:.8rem}header{display:block}}</style></head><body><main><header><div><p>担任用・初回設定</p><h1>授業日カレンダー</h1><p>土日を自動で休業日にします。祝日・長期休業・振替休業・土曜授業など、学校独自の日だけ直せます。</p></div><nav><a href="teacher.html">初期設定へ戻る</a>　<a href="monthly-attendance.html">月間出席簿</a></nav></header><section class="card"><div class="controls"><label>学級<br><input id="cal-class" value="1-1"></label><label>表示月<br><input id="cal-month" type="month"></label><button id="reset-weekends">土日を標準設定</button><button id="save-calendar">この月を保存</button></div><p id="cal-status" class="notice">日をタップすると「授業日 → 休業日 → 特別授業日」の順に切り替わります。</p><div class="legend"><span>□ 授業日</span><span>■ 休業日</span><span>▧ 特別授業日（土曜授業・行事等）</span></div><div id="calendar" class="calendar"></div></section></main><script src="js/school-calendar.js"></script></body></html>

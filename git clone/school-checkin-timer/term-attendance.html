ding:12px 14px;border-radius:14px;background:#eef8ff;color:#326d94;font-weight:700}@media(max-width:900px){.summary,.health-summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){main{padding:14px}header{display:block}}</style></head><body><main><header><div><p>担任用・記録を見る</p><h1>学期・年度出席・健康集計</h1><p>月ごとの確定済み記録を、学期と年度でまとめます。健康観察は心の天気とは別に集計します。</p></div><nav><a href="teacher.html">担任ホーム</a><a href="attendance.html">今日の出席・健康</a><a href="dashboard.html">心の天気・教室のようす</a><a href="monthly-attendance.html">月間出席簿</a><a href="term-settings.html">学期設定</a></nav></header><section class="card"><div class="controls"><label>学級<input id="sum-class" value="1-1"></label><label>年度<select id="sum-year"></select></label><button id="sum-reload">集計を更新</button></div><p id="sum-status" class="notice">読み込み中…</p><div id="summary-root"></div></section></main><script src="js/term-attendance.js"></script></body></html>

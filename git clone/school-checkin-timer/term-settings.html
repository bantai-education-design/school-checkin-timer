<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学期設定 | 朝のチェックイン</title><style>:root{font-family:"Yu Gothic",Meiryo,sans-serif;color:#18324b}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:linear-gradient(145deg,#eef9ff,#fff9e7)}main{max-width:980px;width:100%;margin:auto;padding:28px;min-width:0}header,.card{min-width:0;background:#fff;border-radius:26px;padding:22px;box-shadow:0 16px 40px #254c6a18;margin-bottom:16px}header{display:flex;justify-content:space-between;gap:18px;align-items:center}header>div,nav,.controls,.terms,.term,label{min-width:0}h1,h2,p{margin-top:0;overflow-wrap:anywhere}a{color:#267cb8;font-weight:800;overflow-wrap:anywhere}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.terms{display:grid;gap:12px}.term{display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:end;padding:16px;border:2px solid #e1edf3;border-radius:18px}.term strong{font-size:1.1rem}label{display:flex;flex-direction:column;gap:5px;color:#617b8e;font-weight:800}input,select,button{font:inherit;max-width:100%;min-width:0;padding:10px 12px;border:2px solid #dce9f0;border-radius:12px;background:#fff}input,select{width:100%}button{font-weight:900;cursor:pointer;white-space:normal}.save{background:#2f8fd4;color:#fff;border-color:#2f8fd4}.notice{padding:12px 14px;border-radius:14px;background:#eef8ff;color:#326d94;font-weight:700}.hint{color:#6a8294;font-weight:700}@media(max-width:650px){main{padding:14px}header{display:block;padding:18px}header nav{display:flex;flex-wrap:wrap;gap:8px 14px}.card{padding:16px}.term{grid-template-columns:minmax(0,1fr)}.controls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.controls button{width:100%}}@media(max-width:420px){main{padding:10px}.controls{grid-template-columns:minmax(0,1fr)}header,.card{border-radius:20px}.term{padding:12px}}</style></head><body><main><header><div><p>担任用・年度設定</p><h1>学期設定</h1><p>標準値を用意し、学校で違う開始日・終了日だけ直します。</p></div><nav><a href="teacher.html">初期設定</a><a href="monthly-attendance.html">月間出席簿</a></nav></header><section class="card"><div class="controls"><label>学級<input id="term-class" value="1-1"></label><label>年度<select id="school-year"></select></label><button id="reset-standard">標準値に戻す</button><button id="save-terms" class="save">学期設定を保存</button></div><p id="term-status" class="notice">学校の年間予定表に合わせて、必要な日付だけ修正してください。</p><p class="hint">※ 初期値は操作を始めやすくするための仮設定です。学校暦・C4th等から正式情報を取得できる場合は、将来ここへ自動反映できる構造にします。</p><div id="terms" class="terms"></div></section></main><script src="js/term-settings.js"></script></body></html>
